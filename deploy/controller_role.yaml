apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-sa
  namespace: kda-test
  labels:
    app: controller

---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: controller-role
  namespace: kda-test
  labels:
    app: controller
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/portforward", "persistentvolumeclaims"]
  verbs: ["get", "watch", "list", "create", "delete", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "watch", "list", "create", "delete", "patch", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "watch", "list", "create", "patch", "update"]

---

kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: controller-rolebinding
  namespace: kda-test
subjects:
- kind: ServiceAccount
  name: controller-sa
  namespace: kda-test
roleRef:
  kind: Role
  name: controller-role
  apiGroup: rbac.authorization.k8s.io
