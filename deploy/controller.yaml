apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: swlabpods
spec:
  replicas: 2
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: controller-sa
      containers:
      - name: controller
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9001
        env:
        - name: K8S_NAMESPACE
          value: swlabpods
        - name: REDIS_URL
          value: redis://controller-queue-redis:6379/0
        - name: COMPUTE_POOL_MODE
          value: cold_start
        - name: COMPUTE_AVAILABILITY_WATCH_ENABLED
          value: "false"
        - name: WAIT_QUEUE_ALLOCATING_TTL_SECONDS
          value: "300"
        - name: COLD_START_POD_READY_TIMEOUT_SECONDS
          value: "300"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: controller-service
  namespace: swlabpods
spec:
  selector:
    app: controller
  ports:
  - protocol: TCP
    port: 9001
    targetPort: 9001
  type: ClusterIP
