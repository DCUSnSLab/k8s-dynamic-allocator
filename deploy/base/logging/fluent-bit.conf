[SERVICE]
    Flush                5
    Daemon               Off
    Log_Level            info
    Parsers_File         parsers.conf
    HTTP_Server          On
    HTTP_Listen          0.0.0.0
    HTTP_Port            2020
    storage.path         /buffers/fluent-bit/
    storage.sync         normal
    storage.backlog.mem_limit 50M

[INPUT]
    Name                 tail
    Tag                  kube.*
    # Watch only experiment system components. User command output is
    # recorded by simulator/results, so user pods are intentionally omitted.
    Path                 /var/log/containers/swlabssh-*_${KDA_NAMESPACE}_swlabssh-*.log,/var/log/containers/controller-*_${KDA_NAMESPACE}_controller-*.log,/var/log/containers/compute-*_${KDA_NAMESPACE}_compute-agent-*.log,/var/log/containers/controller-queue-redis-*_${KDA_NAMESPACE}_redis-*.log
    Path_Key             filename
    Parser               cri
    DB                   /buffers/fluent-bit/kda-system-tail.db
    Mem_Buf_Limit        50MB
    Skip_Long_Lines      On
    Refresh_Interval     5
    # Read newly discovered files from byte 0. Without this the tail starts at
    # EOF, so everything a short-lived Compute Pod logged before the next
    # Refresh_Interval scan is lost. Files already in DB resume from their
    # stored offset, so this does not re-read anything.
    Read_from_Head       On
    storage.type         filesystem
    # Poll with stat() instead of inotify. Several nodes have exhausted
    # fs.inotify.max_user_instances, so inotify_init() fails with EMFILE and
    # the tail input cannot start at all. Files are still picked up within
    # Refresh_Interval.
    Inotify_Watcher      Off

[FILTER]
    Name                 kubernetes
    Match                kube.*
    Kube_Tag_Prefix      kube.var.log.containers.
    Kube_URL             https://kubernetes.default.svc:443
    Kube_CA_File         /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File      /var/run/secrets/kubernetes.io/serviceaccount/token
    Merge_Log            On
    Merge_Log_Key        app_log
    K8S-Logging.Parser   On
    K8S-Logging.Exclude  On
    Labels               On
    Annotations          Off

# Keep this project's namespace only.
[FILTER]
    Name                 grep
    Match                kube.*
    Regex                $kubernetes['namespace_name'] ^${KDA_NAMESPACE}$

# Keep only allocator experiment system components. User pods, smoke checks,
# log-reader pods, and Fluent Bit itself are intentionally excluded.
[FILTER]
    Name                 grep
    Match                kube.*
    Logical_Op           or
    Regex                $kubernetes['labels']['app'] ^(controller|warm-pod-pool|controller-queue-redis)$
    Regex                $kubernetes['labels']['kubessh'] ^swlabssh$

[OUTPUT]
    Name                 file
    Match                kube.*
    Path                 /mnt/logs
    File                 ${NODE_NAME}.jsonl
    Format               plain
    Mkdir                true
