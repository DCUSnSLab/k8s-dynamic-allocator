apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: swlabpods
  labels:
    app: fluent-bit
    k8s-dynamic-allocator/deploy-stage: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              # 로그를 거둘 노드를 우리 라벨로 못박는다. 이 파드는 logs-pvc 를
              # 마운트하는데 그것이 Longhorn 볼륨이라, 클러스터에 막 붙은 노드에서는
              # Longhorn 과 CNI 가 올라오기 전까지 뜰 수 없다. 아래 tolerations 가
              # 모든 taint 를 무시하므로 DaemonSet 은 NotReady 인 그 노드에도
              # 파드를 넣고, FailedAttachVolume 로 영원히 ContainerCreating 에
              # 머문다. 운영 서비스가 쓰는 라벨을 건드리지 않으려고 우리 라벨을
              # 더하는 방식이며, 새 노드를 실험에 넣을 때 라벨을 붙이면 된다.
              - key: k8s-dynamic-allocator/logs
                operator: In
                values:
                - "true"
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      terminationGracePeriodSeconds: 10
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.1.9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 2020
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KDA_NAMESPACE
          value: swlabpods
        resources:
          requests:
            cpu: "50m"
            memory: "100Mi"
          limits:
            cpu: "300m"
            memory: "300Mi"
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/
        - name: flb-storage
          mountPath: /buffers/fluent-bit
        - name: logs-pvc
          mountPath: /mnt/logs
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: config
        configMap:
          name: fluent-bit-config
      - name: flb-storage
        hostPath:
          path: /var/log/fluent-bit-storage
          type: DirectoryOrCreate
      - name: logs-pvc
        persistentVolumeClaim:
          claimName: logs-pvc
