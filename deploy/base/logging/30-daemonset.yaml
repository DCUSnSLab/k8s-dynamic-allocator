apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: swlabpods
  labels:
    app: fluent-bit
    k8s-dynamic-allocator/deploy-stage: logging
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
              # 실험 워크로드를 올리는 노드에만 둔다. n4 는 kubelet 의 maxPods 가
              # 기본값 110 인데 다른 노드는 250 이고, 고정 배치된 다른 네임스페이스의
              # 파드가 이미 80 개 올라가 있어 우리 쪽은 n4 를 비워 둔다.
              #
              # 라벨로 거르는 또 다른 이유는 노드 추가다. 아래 tolerations 가 모든
              # taint 를 무시하므로 DaemonSet 은 막 붙은 NotReady 노드에도 파드를
              # 넣고, 그 노드의 CNI 와 Longhorn 이 올라오기 전까지 이 파드는
              # logs-pvc 를 붙이지 못해 ContainerCreating 에 머물며 실패 이벤트만
              # 쌓는다. 운영 서비스가 쓰는 라벨은 건드리지 않고 우리 라벨을 더하는
              # 방식이라, 새 노드를 실험에 넣을 때 라벨만 붙이면 된다.
              - key: k8s-dynamic-allocator/workload
                operator: In
                values:
                - "true"
      tolerations:
      - operator: Exists
        effect: NoSchedule
      - operator: Exists
        effect: NoExecute
      terminationGracePeriodSeconds: 10
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.1.9
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 2020
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KDA_NAMESPACE
          value: swlabpods
        resources:
          requests:
            cpu: "50m"
            memory: "100Mi"
          limits:
            cpu: "300m"
            memory: "300Mi"
        volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: config
          mountPath: /fluent-bit/etc/
        - name: flb-storage
          mountPath: /buffers/fluent-bit
        - name: logs-pvc
          mountPath: /mnt/logs
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: config
        configMap:
          name: fluent-bit-config
      - name: flb-storage
        hostPath:
          path: /var/log/fluent-bit-storage
          type: DirectoryOrCreate
      - name: logs-pvc
        persistentVolumeClaim:
          claimName: logs-pvc
