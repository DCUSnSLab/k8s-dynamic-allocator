apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: bootstrap

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
  labels:
    k8s-dynamic-allocator/deploy-stage: bootstrap
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods"]
  verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
  labels:
    k8s-dynamic-allocator/deploy-stage: bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
- kind: ServiceAccount
  name: fluent-bit
  namespace: swlabpods
