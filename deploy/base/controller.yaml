apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      # 실험 워크로드를 올리는 노드에만 둔다. n4 는 kubelet 의 maxPods 가 기본값
      # 110 인데 다른 노드는 250 이고, 다른 네임스페이스의 파드가 이미 80 개
      # 올라가 있다. 그 한도는 admission 단계에서 걸리는 것이라 CPU 와 메모리가
      # 남아 있어도 파드 생성이 막히고, n4 에 고정된 StatefulSet 이 재생성되지
      # 못하는 일이 생긴다. 운영 서비스가 쓰는 라벨은 건드리지 않고 우리 라벨을
      # 더하는 방식이다.
      nodeSelector:
        k8s-dynamic-allocator/workload: "true"
      serviceAccountName: controller-sa
      containers:
      - name: controller
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9001
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: REDIS_URL
          value: redis://controller-queue-redis:6379/0
        # The controller ignores this on this branch - the mode is pinned in
        # settings - but the load generator reads it off the Deployment to
        # decide whether R/N apply, so it has to say what is actually running.
        - name: COMPUTE_ALLOCATION_MODE
          value: cold_start
        # N for this arm. The warm arm keeps it on the compute Deployment's
        # annotation; this arm has no Deployment, so deploy.sh patches the
        # build parameter in here. Both arms have to run the same N or the
        # comparison is not under one constraint.
        - name: BUFFER_CAPACITY
          value: ""
        # DEBUG 가 켜져 있으면 Django 가 SQL 과 요청 정보를 프로세스 안에 모아 두고
        # 예외마다 트레이스백 페이지를 만든다. 측정하는 쪽에서는 메모리와 응답 시간에
        # 잡음만 더하는 것이라 끈다. 기본값이 true 이므로 명시해야 한다.
        - name: DJANGO_DEBUG
          value: "false"
        # 제안 시스템과 같은 값을 쓴다. 비교군끼리 컨트롤러 자원이 다르면 할당이
        # 부하를 따라가는 정도가 달라져 비교가 그 차이를 재게 된다. 500m 한도에서는
        # 제안 쪽 리더가 CPU 주기의 59~63% 를 throttle 당했고, 이 arm 은 요청마다
        # 파드를 만들고 지우므로 같은 일을 컨트롤러가 더 자주 한다.
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: controller-service
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  selector:
    app: controller
  ports:
  - protocol: TCP
    port: 9001
    targetPort: 9001
  type: ClusterIP
