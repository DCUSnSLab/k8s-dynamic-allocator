apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: controller-sa
      containers:
      - name: controller
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9001
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: REDIS_URL
          value: redis://controller-queue-redis:6379/0
        - name: COMPUTE_POOL_MODE
          value: warm_pool
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: controller-service
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  selector:
    app: controller
  ports:
  - protocol: TCP
    port: 9001
    targetPort: 9001
  type: ClusterIP
