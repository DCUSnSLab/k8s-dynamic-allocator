apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      serviceAccountName: controller-sa
      containers:
      - name: controller
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9001
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: REDIS_URL
          value: redis://controller-queue-redis:6379/0
        # The controller ignores this on this branch - the mode is pinned in
        # settings - but the load generator reads it off the Deployment to
        # decide whether R/N apply, so it has to say what is actually running.
        - name: COMPUTE_ALLOCATION_MODE
          value: cold_start
        # N for this arm. The warm arm keeps it on the compute Deployment's
        # annotation; this arm has no Deployment, so deploy.sh patches the
        # build parameter in here. Both arms have to run the same N or the
        # comparison is not under one constraint.
        - name: BUFFER_CAPACITY
          value: ""
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: controller-service
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  selector:
    app: controller
  ports:
  - protocol: TCP
    port: 9001
    targetPort: 9001
  type: ClusterIP
