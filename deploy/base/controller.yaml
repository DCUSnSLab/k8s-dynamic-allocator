apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
    spec:
      # 실험 워크로드를 올리는 노드에만 둔다. n4 는 kubelet 의 maxPods 가 기본값
      # 110 인데 다른 노드는 250 이고, 다른 네임스페이스의 파드가 이미 80 개
      # 올라가 있다. 그 한도는 admission 단계에서 걸리는 것이라 CPU 와 메모리가
      # 남아 있어도 파드 생성이 막히고, n4 에 고정된 StatefulSet 이 재생성되지
      # 못하는 일이 생긴다. 운영 서비스가 쓰는 라벨은 건드리지 않고 우리 라벨을
      # 더하는 방식이다.
      nodeSelector:
        k8s-dynamic-allocator/workload: "true"
      serviceAccountName: controller-sa
      containers:
      - name: controller
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 9001
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: REDIS_URL
          value: redis://controller-queue-redis:6379/0
        # 컨트롤러는 이 값을 읽지 않는다(이 브랜치는 경로가 하나이고 settings 에
        # 고정돼 있다). 평가 도구가 이 Deployment 에서 읽어 run 이 어느 arm 을
        # 쟀는지 적으므로, 실제로 도는 것을 말해야 한다.
        - name: COMPUTE_ALLOCATION_MODE
          value: warm_buffer_direct
        # R/N. Deployment 가 없으므로 컨트롤러 env 로 받는다. deploy.sh 가 빌드
        # 파라미터로 덮어쓴다. N 이 비어 있으면 컨트롤러는 파드를 하나도 만들지 않는다.
        - name: BUFFER_RESERVE
          value: ""
        - name: BUFFER_CAPACITY
          value: ""
        # DEBUG 가 켜져 있으면 Django 가 SQL 과 요청 정보를 프로세스 안에 모아 두고
        # 예외마다 트레이스백 페이지를 만든다. 측정하는 쪽에서는 메모리와 응답 시간에
        # 잡음만 더하는 것이라 끈다. 기본값이 true 이므로 명시해야 한다.
        - name: DJANGO_DEBUG
          value: "false"
        # The reconciler runs on the leader only, so adding replicas does not
        # share this work - the limit has to carry it. At N=100 the leader sat at
        # 377m against a 500m limit and spent 59-63% of its CPU periods throttled,
        # which shows up as allocation falling behind the load it is meant to
        # measure. Two cores leaves room for the buffer sizes a large N asks for.
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2"
            memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: controller-service
  namespace: swlabpods
  labels:
    k8s-dynamic-allocator/deploy-stage: controller
spec:
  selector:
    app: controller
  ports:
  - protocol: TCP
    port: 9001
    targetPort: 9001
  type: ClusterIP
