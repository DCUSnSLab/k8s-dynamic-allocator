apiVersion: v1
kind: ServiceAccount
metadata:
  name: swlabssh
  namespace: swlabpods
  labels:
    app: swlabssh
    k8s-dynamic-allocator/deploy-stage: bootstrap
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: swlabssh-role
  namespace: swlabpods
  labels:
    app: swlabssh
    k8s-dynamic-allocator/deploy-stage: bootstrap
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/portforward
      - persistentvolumeclaims
    verbs:
      - get
      - watch
      - list
      - create
      - delete
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: swlabssh-rolebinding
  namespace: swlabpods
  labels:
    app: swlabssh
    k8s-dynamic-allocator/deploy-stage: bootstrap
subjects:
  - kind: ServiceAccount
    name: swlabssh
    namespace: swlabpods
roleRef:
  kind: Role
  name: swlabssh-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swlabssh
  namespace: swlabpods
  labels:
    app: swlabssh
    k8s-dynamic-allocator/deploy-stage: swlabssh
spec:
  replicas: 7
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      kubessh: swlabssh
  template:
    metadata:
      labels:
        app: swlabssh
        kubessh: swlabssh
    spec:
      serviceAccountName: swlabssh
      containers:
        - name: swlabssh
          image: harbor.cu.ac.kr/k8s_dynamic_allocator/swlabssh:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args: ["python3 ./kubessh/app.py --KubeSSH.config_file=kda_config.py"]
          tty: true
          stdin: true
          ports:
            - name: ssh
              containerPort: 8022
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 6
          securityContext:
            privileged: true
          # Every user SSH session is held here, so memory scales with how many
          # are open at once rather than with the request rate. A queued request
          # keeps its session alive, so a slow queue multiplies them: measured
          # 2 sessions per Pod at 16 requests/min but 19 at 24/min, where 500Mi
          # was exceeded and Pods were OOM killed, dropping every session they
          # held. About 20Mi per session over an 84Mi base, and the worst case
          # here is 100 users x 3 concurrent over 7 Pods, so 2Gi leaves room for
          # that plus the load a failed Pod hands to the survivors.
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "600m"
---
apiVersion: v1
kind: Service
metadata:
  name: swlabssh
  namespace: swlabpods
  labels:
    app: swlabssh
    k8s-dynamic-allocator/deploy-stage: swlabssh
spec:
  type: NodePort
  selector:
    kubessh: swlabssh
  ports:
    - name: ssh
      port: 32000
      targetPort: ssh
      protocol: TCP
      nodePort: 30622
