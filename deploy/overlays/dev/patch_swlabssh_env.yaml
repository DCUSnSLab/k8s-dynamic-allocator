apiVersion: apps/v1
kind: Deployment
metadata:
  name: swlabssh
  namespace: swlabpods
spec:
  template:
    spec:
      containers:
        - name: swlabssh
          env:
            - name: K8S_NAMESPACE
              value: kda-test
            - name: USER_POD_STORAGE_CLASS
              value: normal-r3
