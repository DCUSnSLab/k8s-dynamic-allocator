apiVersion: v1
kind: Pod
metadata:
  name: compute-general-cold-template
  labels:
    app: compute-pod
    compute-type: general
    compute-status: assigned
    assigned-user: ""
spec:
  restartPolicy: Always
  # Same general-purpose nodes as the user pods; keeps compute pods off the GPU nodes.
  nodeSelector:
    kubessh: general_node
  containers:
  - name: compute-agent
    image: harbor.cu.ac.kr/k8s_dynamic_allocator/compute_pod:latest
    imagePullPolicy: Always
    args: ["python3", "agent.py", "--config-file", "kda_config.py"]
    ports:
    - containerPort: 8080
      name: agent
    readinessProbe:
      httpGet:
        path: /ready
        port: agent
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 1
      failureThreshold: 3
    # requests == limits: the pod holds exactly what it may use, so its
    # footprint is unambiguous.
    #
    # 제안 시스템의 compute 파드와 같은 값이어야 한다. 실측 사용량이 1코어를 넘지
    # 않아 develop 에서 2코어/4Gi 에서 내려왔고(b62d1b2), 비교군이 2배를 들고 있으면
    # 점유량 비교가 그 차이를 재게 된다.
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    securityContext:
      privileged: true
    volumeMounts:
    - name: ssh-private-key
      mountPath: /etc/ssh-key
      readOnly: true
  volumes:
  - name: ssh-private-key
    secret:
      secretName: compute-ssh-key
      defaultMode: 384
