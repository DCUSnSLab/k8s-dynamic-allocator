apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-general
  labels:
    app: warm-pod-pool
    compute-type: general
  annotations:
    k8s-dynamic-allocator/pool-available-min: "2"
    k8s-dynamic-allocator/pool-total-max: "5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: warm-pod-pool
      compute-type: general
      pool-status: available
  template:
    metadata:
      labels:
        app: warm-pod-pool
        compute-type: general
        pool-status: available
        assigned-user: ""
    spec:
      # Same general-purpose nodes as the user pods; keeps compute pods off the GPU nodes.
      nodeSelector:
        kubessh: general_node
      containers:
      - name: compute-agent
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/compute_pod:latest
        imagePullPolicy: Always
        args: ["python3", "agent.py", "--config-file", "kda_config.py"]
        ports:
        - containerPort: 8080
          name: agent
        readinessProbe:
          httpGet:
            path: /ready
            port: agent
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 3
        # requests == limits: the pod holds exactly what it may use, so its
        # footprint is unambiguous.
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        securityContext:
          privileged: true
        volumeMounts:
        - name: ssh-private-key
          mountPath: /etc/ssh-key
          readOnly: true
      volumes:
      - name: ssh-private-key
        secret:
          secretName: compute-ssh-key
          defaultMode: 384
