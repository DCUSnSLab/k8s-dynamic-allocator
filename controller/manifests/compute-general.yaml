apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-general
  labels:
    app: compute-pod
    compute-type: general
  annotations:
    k8s-dynamic-allocator/buffer-reserve: "2"
    k8s-dynamic-allocator/buffer-capacity: "5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compute-pod
      compute-type: general
      compute-status: available
  template:
    metadata:
      labels:
        app: compute-pod
        compute-type: general
        compute-status: available
        assigned-user: ""
    spec:
      # Same general-purpose nodes as the user pods; keeps compute pods off the GPU nodes.
      #
      # The second label narrows that set to the nodes this experiment may fill.
      # n4-k8s carries kubessh=general_node like n1-n3 but its kubelet keeps the
      # default maxPods of 110 while n1-n3 were raised to 250, and it hosts the
      # harbor registry, prometheus and several databases on local volumes. Pod
      # slots are an admission limit, not a resource one, so filling those 110
      # leaves n4 unable to place a rescheduled pod however much CPU and memory
      # are free - including the harbor pods this experiment pulls its images
      # from. The label is ours alone, so n4 keeps serving the real user pods
      # that select on kubessh=general_node; adding it back to n4 reverts this.
      nodeSelector:
        kubessh: general_node
        k8s-dynamic-allocator/compute: "true"
      containers:
      - name: compute-agent
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/compute_pod:latest
        imagePullPolicy: Always
        args: ["python3", "agent.py", "--config-file", "kda_config.py"]
        ports:
        - containerPort: 8080
          name: agent
        readinessProbe:
          httpGet:
            path: /ready
            port: agent
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 3
        # requests == limits: the pod holds exactly what it may use, so its
        # footprint is unambiguous and the occupancy figures do not depend on
        # which of the two they are counted against.
        #
        # One core because that is what the work uses: every command the
        # experiment runs is a single-threaded python process, so a pod cannot
        # exceed one core whatever the limit says - measured usage ran at 11-31%
        # of the old 2-core request. Asking for two reserved a core that could
        # never be used and capped N at 56 on this cluster; asking for one lifts
        # that to 113, which is what makes a dynamic buffer measurable at all
        # (the buffer a load needs is lambda x creation time, and at N=20 that
        # came to 2.2 - indistinguishable from the floor of 2).
        #
        # 2Gi because the heaviest command allocates 256MB. Memory was never the
        # binding constraint (591GiB free admits far more pods than CPU does).
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        securityContext:
          privileged: true
        volumeMounts:
        - name: ssh-private-key
          mountPath: /etc/ssh-key
          readOnly: true
      volumes:
      - name: ssh-private-key
        secret:
          secretName: compute-ssh-key
          defaultMode: 384
