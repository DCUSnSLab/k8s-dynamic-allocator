apiVersion: apps/v1
kind: Deployment
metadata:
  name: compute-general
  labels:
    app: compute-pod
    compute-type: general
  annotations:
    k8s-dynamic-allocator/buffer-reserve: "2"
    k8s-dynamic-allocator/buffer-capacity: "5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compute-pod
      compute-type: general
      compute-status: available
  template:
    metadata:
      labels:
        app: compute-pod
        compute-type: general
        compute-status: available
        assigned-user: ""
    spec:
      # Same general-purpose nodes as the user pods; keeps compute pods off the GPU nodes.
      nodeSelector:
        kubessh: general_node
      containers:
      - name: compute-agent
        image: harbor.cu.ac.kr/k8s_dynamic_allocator/compute_pod:latest
        imagePullPolicy: Always
        args: ["python3", "agent.py", "--config-file", "kda_config.py"]
        ports:
        - containerPort: 8080
          name: agent
        readinessProbe:
          httpGet:
            path: /ready
            port: agent
          initialDelaySeconds: 1
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 3
        # The CPU request is what the work actually uses, not what the limit
        # allows. Every command the experiment runs is one single-threaded
        # python process, so a pod cannot exceed one core no matter what the
        # limit says - measured usage ran at 11-31% of a 2-core request. Asking
        # for 2 reserved a core that could never be used and capped N at 56 on
        # this cluster; asking for 1 matches the work and lifts that to 113.
        #
        # The limit stays at 2 cores. It is the figure the occupancy numbers are
        # reported against, so changing it would break comparison with every arm
        # already measured, and it leaves room for a burst the request does not
        # reserve. Memory keeps requests == limits: 4Gi is never the binding
        # constraint here (591GiB free admits 144 pods).
        resources:
          requests:
            cpu: "1"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        securityContext:
          privileged: true
        volumeMounts:
        - name: ssh-private-key
          mountPath: /etc/ssh-key
          readOnly: true
      volumes:
      - name: ssh-private-key
        secret:
          secretName: compute-ssh-key
          defaultMode: 384
