# KDA simulator scenario template.
# Every field is listed here with its choices. Keep configs of actual
# experiments under experiments/ and run them with --config.

experiment:
  # Used for the result directory name and request ids.
  name: example_smoke
  # Label only (e.g. warm_buffer, cold_start, baseline_direct). The pool mode the
  # controller actually runs is read from the server into summary.json.
  system: warm_buffer
  # R and N. When both are set, the run applies them to the compute Deployment
  # and waits for the warm buffer before starting. null leaves the server as is.
  buffer_reserve: null
  buffer_capacity: null

ssh:
  host: 203.250.35.87
  port: 30622

users:
  prefix: test
  count: 2
  # How many commands one user may have running at the same time.
  max_concurrent_requests: 1

workload:
  # profile choices:
  #   avg          -> 0.170454 req/min (daily average, vacation excluded)
  #   active_avg   -> 0.278805 req/min (10:00-21:00 average, vacation excluded)
  #   p95_high     -> 0.8 req/min
  #   p99_peak     -> 2.766667 req/min
  #   max_stress   -> 15.05 req/min
  #   nhpp_daily   -> hourly NHPP profile from OnlineJudge DB with vacation excluded, expressed as req/min
  #   any number   -> use that number as lambda_per_minute
  profile: 30

  # scope choices:
  #   system   -> lambda is the total system arrival rate
  #   per_user -> lambda is multiplied by users.count
  lambda_scope: system

  # null means run until Ctrl+C or max_requests is reached.
  duration_minutes: 5
  max_requests: 2

  # Same seed reproduces the same request schedule. null means a different
  # random schedule each run.
  random_seed: 1
  # Optional CSV trace to replay. Prefer generating one trace and replaying it
  # across baseline, warm_buffer, and cold_start experiments.
  trace_file: null

  # Only used when profile is nhpp_daily.
  # 1 means real-time replay, 12 means a 24-hour pattern is replayed in 2 hours.
  nhpp_time_compression: 2
  # null starts from the current local hour. Set 0-23 to make NHPP schedules
  # reproducible across branches even when runs start at different wall times.
  nhpp_start_hour: 0
  # Only used when profile is nhpp_daily. Multiplies every hourly rate.
  nhpp_rate_scale: 1

commands:
  # One item is picked per request by weight.
  items:
    - name: short
      weight: 100
      command: sleep 5

background_activity:
  # Keeps a small CPU and memory load running on every user pod.
  enabled: false
  memory_mb: 20
  cpu_period_seconds: 10
  cpu_busy_seconds: 0.2

setup:
  # Existing user pods/PVCs can use a higher setup concurrency.
  # When recreating all pods/PVCs from scratch, use max_inflight: 10 and
  # retry_delay_seconds: 15 to reduce API server and storage pressure.
  max_inflight: 2
  retry_attempts: 6
  retry_delay_seconds: 15

execution:
  # mode choices:
  #   kda             -> run the command on a compute pod through `run`
  #   baseline_direct -> run the command directly on the user pod
  mode: kda

output:
  dir: evaluation/data

  # -1 = do not save command stdout/stderr
  #  0 = save full command stdout/stderr
  # >0 = save only the last N characters
  command_output_chars: 0
