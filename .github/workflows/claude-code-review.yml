name: Claude Code Review

# PR 댓글에 "@claude review" 를 남기면 인라인 코드 리뷰를 수행한다.
# 자동 실행(pull_request 트리거)은 사용하지 않는다 — 푸시할 때마다 도는 것을 피하기 위함.
on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # issue 가 아닌 PR 의 댓글이면서, "@claude review" 가 포함된 경우에만 실행
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # issue_comment 이벤트의 기본 checkout 은 기본 브랜치를 받아온다.
      # PR 의 실제 코드를 리뷰해야 하므로 PR head 를 명시적으로 받아오고,
      # base 와 diff 를 뜨기 위해 전체 히스토리(fetch-depth: 0)가 필요하다.
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          # 서브모듈 없이 받으면 dcusshk8s 가 빈 디렉터리로 남아 리뷰가 그 안을
          # 읽지 못한다. dcusshk8s 도 public 이라 기본 토큰으로 받아진다.
          submodules: recursive

      # 상위 레포의 diff 에서 서브모듈 변경은 포인터 해시 한 줄로만 보인다.
      # 그대로 두면 run 의 실제 변경이 리뷰에 전혀 노출되지 않으므로, 이전
      # 포인터와 현재 포인터 사이의 diff 를 파일로 풀어 두고 프롬프트에서
      # 읽게 한다.
      - name: Expand submodule diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out=SUBMODULE_CHANGES.diff
          : > "$out"
          base=$(gh pr view "${{ github.event.issue.number }}"                    --repo "${{ github.repository }}"                    --json baseRefOid --jq .baseRefOid)
          # 포인터가 바뀐 서브모듈만 추린다.
          git diff "$base" HEAD --submodule=short             | grep -E '^(-|\+)Subproject commit' || true
          changed=$(git diff --name-only "$base" HEAD -- $(git config -f .gitmodules --get-regexp path | awk '{print $2}') || true)
          for path in $changed; do
            old=$(git rev-parse "$base:$path" 2>/dev/null || true)
            new=$(git rev-parse "HEAD:$path" 2>/dev/null || true)
            [ -n "$old" ] && [ -n "$new" ] && [ "$old" != "$new" ] || continue
            echo "===== submodule $path: $old -> $new =====" >> "$out"
            git -C "$path" fetch --quiet origin "$old" "$new" 2>/dev/null ||               git -C "$path" fetch --quiet --unshallow origin 2>/dev/null || true
            git -C "$path" diff "$old" "$new" >> "$out" 2>/dev/null               || echo "(diff 실패: $path)" >> "$out"
            echo >> "$out"
          done
          if [ -s "$out" ]; then
            echo "서브모듈 변경을 $out 에 펼쳤다 ($(wc -l < "$out") 줄)"
          else
            echo "서브모듈 변경 없음"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: >-
            /code-review:code-review --comment
            ${{ github.repository }}/pull/${{ github.event.issue.number }}

            이 저장소는 dcusshk8s 를 서브모듈로 쓴다. PR diff 에서 서브모듈
            변경은 포인터 해시 한 줄로만 보이지만, 실제 코드 변경은 그 안에
            있다. 저장소 루트에 SUBMODULE_CHANGES.diff 가 있으면 반드시 읽고,
            거기 담긴 변경도 PR 의 일부로 함께 리뷰할 것. 지적을 달 때는 해당
            파일이 서브모듈에 있다는 점을 밝힐 것 — 인라인 코멘트는 상위
            저장소 파일에만 달 수 있으므로, 서브모듈 지적은 요약 코멘트에
            파일과 줄 번호를 적어 남긴다.
          # 지적이 0건이어도 Actions 실행 요약 페이지에 결과를 남긴다 (PR 코멘트는 아니다)
          display_report: true
          # Read·Grep·Glob 이 없으면 프롬프트에 실린 diff 만 보고 판단한다.
          #
          # Bash(gh pr ...) 는 요약 코멘트 때문에 필요하다. code-review 플러그인은 인라인
          # 지적은 MCP 도구로 달지만, 마지막 요약은 `gh pr comment` 로 단다. 이게 막혀 있으면
          # 지적 0건인 PR 에서 리뷰가 아무 흔적 없이 끝난다.
          # 통짜 Bash 는 열지 않는다 — public 저장소라 외부 기여자 PR 에서 임의 명령이
          # 도는 위험은 만들지 않는다. gh 의 읽기·코멘트 하위 명령만 연다.
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
